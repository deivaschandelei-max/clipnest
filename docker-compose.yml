services:
clipnest:
build:
context: .
dockerfile: Dockerfile
container_name: clipnest
restart: unless-stopped
init: true
ports:
- "3000:3000"
env_file:
- .env
environment:
NODE_ENV: production
HOST: 0.0.0.0
PORT: 3000
TEMP_DIR: /tmp/clipnest
YTDLP_PATH: /opt/yt-dlp-venv/bin/yt-dlp
FFMPEG_PATH: /usr/bin/ffmpeg
tmpfs:
- /tmp/clipnest:size=2g,mode=1777
security_opt:
- no-new-privileges:true
cap_drop:
- ALL
pids_limit: 100
mem_limit: 2g
cpus: 2.0
healthcheck:
test:
- CMD
- node
- -e
- "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
interval: 30s
timeout: 5s
retries: 3
start_period: 20s
